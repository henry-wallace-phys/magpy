[project]
name = "magpy"
version = "0.1.0"
description = "JAX-accelerated neutrino physics framework with optional CUDA support"
readme = "README.md"
authors = [
    { name = "Henry Wallace", email = "henry.wallace.phys@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aenum>=3.1.16",
    "click>=8.2.1",
    "jax>=0.6.2",
    "jaxlib>=0.6.2",
    "matplotlib>=3.10.5",
    "pandas>=2.3.1",
    "pytest>=8.4.1",
    "pyyaml>=6.0.2",
    "rich>=14.1.0",
    "scipy>=1.15.3",
    "tqdm>=4.67.1",
    "uproot>=5.6.4",
]

[project.optional-dependencies]
cuda = [
    "jax[cuda12]>=0.6.2",
]

[project.scripts]
magpy_benchmark = "magpy.apps.__main__benchmarker__:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "line-profiler>=5.0.0",
    "pytest>=8.4.1",
]
cuda = [
    "jax[cuda12]>=0.6.2",
]
