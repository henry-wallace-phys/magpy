---
Systematics:
  - syst_name: mysyst1
    spline_name: mysyst1
    range: [-999, 999]
    modes: [0]
    nominal: 1.0
    error: 0.1
    syst_type: "spline"
  - syst_name: mysyst2
    spline_name: mysyst2
    range: [-999, 999]
    modes: [2]
    nominal: 1.0
    error: 0.1
    syst_type: "spline"
  
  - syst_name: mysyst3
    spline_name: mysyst3
    range: [-999, 999]
    modes: [1]
    nominal: 1.0
    error: 0.1
    syst_type: "spline"

  - syst_name: mysyst4
    spline_name: mysyst4
    range: [-999, 999]
    modes: [3]
    nominal: 1.0
    error: 0.1
    syst_type: "spline"

  - syst_name: mysyst5
    spline_name: mysyst5
    range: [-999, 999]
    modes: [4]
    nominal: 1.0
    error: 0.1
    syst_type: "spline"

  - syst_name: mysyst5
    spline_name: mysyst5
    range: [0, 999]
    modes: [1]
    nominal: 1.0
    error: 0.1
    syst_type: "norm"

# Oscillation parameter priors for MCMC
OscillationPriors:
  - param_name: "theta12"
    nominal: 0.3
    error: 0.02
    range: [0.1, 0.6]
    prior_type: "gaussian"
    
  - param_name: "theta13"  
    nominal: 0.02
    error: 0.002
    range: [0.005, 0.05]
    prior_type: "gaussian"
    
  - param_name: "theta23"
    nominal: 0.55
    error: 0.05
    range: [0.3, 0.8]
    prior_type: "gaussian"
    
  - param_name: "deltacp"
    nominal: -1.8  # 0.7 * pi
    error: 0.314159265  # 0.1 * pi
    range: [-3.1415927, 3.1415927]  # [0, 2*pi]
    prior_type: "flat"
    
  - param_name: "dm21"
    nominal: 7.5e-5
    error: 0.5e-5
    range: [6.0e-5, 9.0e-5]
    prior_type: "gaussian"
    
  - param_name: "dm32"
    nominal: 2.5e-3
    error: 0.1e-3
    range: [-3.0e-3, 3.0e-3]
    prior_type: "flat"