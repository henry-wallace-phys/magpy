[project]
name = "magpy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Henry Wallace", email = "henry.wallace.phys@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.2.1",
    "matplotlib>=3.10.5",
    "pandas>=2.3.1",
    "pytest>=8.4.1",
    "rich>=14.1.0",
    "scipy>=1.15.3",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "uproot>=5.6.4",
]

[project.scripts]
magpy_benchmark = "magpy.apps.__main__benchmarker__:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

