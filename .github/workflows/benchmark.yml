# Update Benchmarking plots
name: Benchmarks

# The events that trigger the workflow
on:
  push:
    branches: [ main ]

permissions:
  contents: write
  packages: write



jobs:
  benchmark:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: 'cpu'
            compile_opts: echo "No Compiler args"
            branch: "cpu-benchmarks"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Make venv
        run: |
            uv venv --python 3.11
            source .venv/bin/activate
            uv pip install .
            ${{ matrix.compile_opts }}
          
      - name: Run Benchmarks
        run: |
            source .venv/bin/activate
            uv run magpy_benchmark --out_folder benchmarks

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.branch }}
          path: benchmarks/*png

