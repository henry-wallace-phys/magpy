name: Run Unit Tests
on: [push]

jobs:
  unit_tests:
    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Make venv
        run: uv venv --python 3.11; source .venv/bin/activate

      - name: Install the project
        run: uv pip install .

      - name: Run tests
        # For example, using `pytest`
        run: uv run pytest tests
